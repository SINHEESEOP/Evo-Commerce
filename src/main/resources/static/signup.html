<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - Evo-Commerce</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <a class="brand" href="/index.html">Evo-Commerce</a>
    <a href="/products.html">상품 목록</a>
    <span class="spacer"></span>
    <a href="/login.html" id="nav-login">로그인</a>
    <a href="/signup.html" id="nav-signup">회원가입</a>
    <a href="/product-register.html" id="nav-register" hidden>상품 등록</a>
    <button id="nav-logout" hidden>로그아웃</button>
</nav>
<main>
    <a class="back-link" href="/index.html">← 홈으로</a>
    <h1>회원가입</h1>
    <form id="signup-form" class="card">
        <label>이메일 <input type="email" id="email" required></label>
        <label>비밀번호 <input type="password" id="password" required minlength="8"></label>
        <label>이름 <input type="text" id="name" required></label>
        <button type="submit">가입하기</button>
    </form>
    <p id="result" class="message"></p>
</main>

<script src="/js/nav.js"></script>
<script>
    document.getElementById('signup-form').addEventListener('submit', async function (event) {
        event.preventDefault();

        const response = await fetch('/api/auth/signup', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                name: document.getElementById('name').value
            })
        });

        const body = await response.json();
        const result = document.getElementById('result');

        if (response.ok && body.success) {
            result.textContent = `${body.data.name}님, 가입이 완료됐습니다. 로그인 페이지로 이동합니다.`;
            result.classList.remove('error');
            setTimeout(function () {
                window.location.href = '/login.html';
            }, 1000);
        } else {
            result.textContent = `가입 실패: ${body.message}`;
            result.classList.add('error');
        }
    });
</script>
</body>
</html>
