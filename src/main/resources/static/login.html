<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 - Evo-Commerce</title>
    <script>
        if (localStorage.getItem('accessToken')) {
            window.location.replace('/products.html');
        }
    </script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <a class="brand" href="/index.html">Evo-Commerce</a>
    <a href="/products.html">상품 목록</a>
    <span class="spacer"></span>
    <a href="/login.html" id="nav-login">로그인</a>
    <a href="/signup.html" id="nav-signup">회원가입</a>
    <a href="/product-register.html" id="nav-register" hidden>상품 등록</a>
    <button id="nav-logout" hidden>로그아웃</button>
</nav>
<main>
    <a class="back-link" href="/index.html">← 홈으로</a>
    <h1>로그인</h1>
    <form id="login-form" class="card">
        <label>이메일 <input type="email" id="email" required></label>
        <label>비밀번호 <input type="password" id="password" required></label>
        <button type="submit">로그인</button>
    </form>
    <p id="result" class="message"></p>
</main>

<script src="/js/nav.js"></script>
<script>
    document.getElementById('login-form').addEventListener('submit', async function (event) {
        event.preventDefault();

        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            })
        });

        const body = await response.json();
        const result = document.getElementById('result');

        if (response.ok && body.success) {
            localStorage.setItem('accessToken', body.data.token);
            localStorage.setItem('role', body.data.user.role);
            result.textContent = `${body.data.user.name}님, 환영합니다. 상품 목록으로 이동합니다.`;
            result.classList.remove('error');
            setTimeout(function () {
                window.location.href = '/products.html';
            }, 600);
        } else {
            result.textContent = `로그인 실패: ${body.message}`;
            result.classList.add('error');
        }
    });
</script>
</body>
</html>
