<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>결제 결과 - Evo-Commerce</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <a class="brand" href="/index.html">Evo-Commerce</a>
    <a href="/products.html">상품 목록</a>
    <span class="spacer"></span>
    <a href="/login.html" id="nav-login">로그인</a>
    <a href="/signup.html" id="nav-signup">회원가입</a>
    <a href="/product-register.html" id="nav-register" hidden>상품 등록</a>
    <button id="nav-logout" hidden>로그아웃</button>
</nav>
<main>
    <h1>결제 결과</h1>
    <div class="card result-card">
        <p id="result" class="message">처리 중...</p>
    </div>
    <a class="back-link" href="/products.html">← 상품 목록으로</a>
</main>

<script src="/js/nav.js"></script>
<script>
    (async function () {
        const token = localStorage.getItem('accessToken');
        const result = document.getElementById('result');
        const params = new URLSearchParams(window.location.search);

        const paymentKey = params.get('paymentKey');
        const tossOrderId = params.get('orderId');
        const amount = params.get('amount');
        const failMessage = params.get('message');

        if (!paymentKey) {
            result.textContent = `결제 실패: ${failMessage ?? '알 수 없는 오류'}`;
            result.classList.add('error');
            return;
        }

        const orderId = tossOrderId.replace('ORDER-', '');

        const response = await fetch(`/api/orders/${orderId}/payments/confirm`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({paymentKey: paymentKey, amount: Number(amount)})
        });

        if (handleUnauthorized(response)) {
            return;
        }

        const body = await response.json();

        if (response.ok && body.success) {
            result.textContent = `결제 승인 완료. 주문 상태: ${body.data.status}`;
        } else {
            result.textContent = `결제 승인 실패: ${body.message}`;
            result.classList.add('error');
        }
    })();
</script>
</body>
</html>
