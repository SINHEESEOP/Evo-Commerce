<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>타임세일 등록 - Evo-Commerce</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <a class="brand" href="/index.html">Evo-Commerce</a>
    <a href="/products.html">상품 목록</a>
    <a href="/timesales.html">타임세일</a>
    <span class="spacer"></span>
    <a href="/login.html" id="nav-login">로그인</a>
    <a href="/signup.html" id="nav-signup">회원가입</a>
    <a href="/product-register.html" id="nav-register" hidden>상품 등록</a>
    <a href="/timesale-register.html" id="nav-timesale-register" hidden>타임세일 등록</a>
    <button id="nav-logout" hidden>로그아웃</button>
</nav>
<main>
    <a class="back-link" href="/timesales.html">← 타임세일 목록으로</a>
    <h1>타임세일 등록</h1>
    <form id="register-form" class="card">
        <label>상품 ID <input type="number" id="productId" min="1" required></label>
        <label>타임세일가 <input type="number" id="discountPrice" min="0" required></label>
        <label>선착순 인원 <input type="number" id="participantLimit" min="1" value="100" required></label>
        <label>시작 시각 <input type="datetime-local" id="startAt" required></label>
        <label>종료 시각 <input type="datetime-local" id="endAt" required></label>
        <button type="submit">등록하기</button>
    </form>
    <p id="permission-notice" class="message error" hidden>MASTER 권한이 있는 계정만 타임세일을 등록할 수 있습니다.</p>
    <p id="result" class="message"></p>
</main>

<script src="/js/nav.js"></script>
<script>
    const token = localStorage.getItem('accessToken');
    const role = localStorage.getItem('role');

    if (!token) {
        window.location.href = '/login.html';
    } else if (role !== 'MASTER') {
        document.getElementById('register-form').hidden = true;
        document.getElementById('permission-notice').hidden = false;
    }

    document.getElementById('register-form').addEventListener('submit', async function (event) {
        event.preventDefault();

        const response = await fetch('/api/timesales', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
                productId: Number(document.getElementById('productId').value),
                discountPrice: Number(document.getElementById('discountPrice').value),
                participantLimit: Number(document.getElementById('participantLimit').value),
                startAt: document.getElementById('startAt').value,
                endAt: document.getElementById('endAt').value
            })
        });

        if (handleUnauthorized(response)) {
            return;
        }

        const body = await response.json();
        const result = document.getElementById('result');

        if (response.ok && body.success) {
            result.textContent = `${body.data.productName} 타임세일이 등록됐습니다. 타임세일 목록으로 이동합니다.`;
            result.classList.remove('error');
            setTimeout(function () {
                window.location.href = '/timesales.html';
            }, 1000);
        } else {
            result.textContent = `등록 실패: ${body.message}`;
            result.classList.add('error');
        }
    });
</script>
</body>
</html>
