<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>결제 - Evo-Commerce</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://js.tosspayments.com/v1/payment"></script>
</head>
<body>
<nav>
    <a class="brand" href="/index.html">Evo-Commerce</a>
    <a href="/products.html">상품 목록</a>
    <span class="spacer"></span>
    <a href="/login.html" id="nav-login">로그인</a>
    <a href="/signup.html" id="nav-signup">회원가입</a>
    <a href="/product-register.html" id="nav-register" hidden>상품 등록</a>
    <button id="nav-logout" hidden>로그아웃</button>
</nav>
<main>
    <a class="back-link" href="/products.html">← 상품 목록으로</a>
    <h1>주문 결제</h1>
    <dl id="order-detail"></dl>
    <button class="primary-button" id="pay-button">결제하기</button>
    <p id="result" class="message"></p>
</main>

<script src="/js/nav.js"></script>
<script>
    (async function () {
        const clientKey = 'test_ck_4yKeq5bgrpeKP029mLPZ8GX0lzW6';
        const token = localStorage.getItem('accessToken');
        const result = document.getElementById('result');

        if (!token) {
            window.location.href = '/login.html';
            return;
        }

        const orderId = new URLSearchParams(window.location.search).get('orderId');

        const response = await fetch(`/api/orders/${orderId}`, {
            headers: {'Authorization': `Bearer ${token}`}
        });

        if (handleUnauthorized(response)) {
            return;
        }

        const body = await response.json();

        if (!response.ok || !body.success) {
            result.textContent = `주문 조회 실패: ${body.message}`;
            result.classList.add('error');
            return;
        }

        const order = body.data;
        const orderName = order.items.map(item => item.productName).join(', ');

        document.getElementById('order-detail').innerHTML = `
            <dt>주문번호</dt><dd>${order.id}</dd>
            <dt>주문상태</dt><dd>${order.status}</dd>
            <dt>결제금액</dt><dd>${order.totalAmount}원</dd>
        `;

        document.getElementById('pay-button').addEventListener('click', () => {
            const tossPayments = TossPayments(clientKey);
            tossPayments.requestPayment('카드', {
                amount: order.totalAmount,
                orderId: `ORDER-${order.id}`,
                orderName: orderName,
                successUrl: `${window.location.origin}/checkout-result.html`,
                failUrl: `${window.location.origin}/checkout-result.html`
            });
        });
    })();
</script>
</body>
</html>
