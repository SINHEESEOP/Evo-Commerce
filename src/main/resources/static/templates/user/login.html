<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 - Evo-Commerce</title>
    <script>
        if (localStorage.getItem('accessToken')) {
            window.location.replace('/index.html');
        }
    </script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <a class="brand" href="/index.html">Evo-Commerce</a>
    <a href="/templates/product/products.html">상품 목록</a>
    <a href="/templates/timesale/timesales.html">타임세일</a>
    <span class="spacer"></span>
    <a href="/templates/user/login.html" id="nav-login">로그인</a>
    <a href="/templates/user/signup.html" id="nav-signup">회원가입</a>
    <a href="/templates/product/product-register.html" id="nav-register" hidden>상품 등록</a>
    <a href="/templates/timesale/timesale-register.html" id="nav-timesale-register" hidden>타임세일 등록</a>
    <button id="nav-logout" hidden>로그아웃</button>
</nav>
<main>
    <a class="back-link" href="/index.html">← 홈으로</a>
    <h1>로그인</h1>
    <form id="login-form" class="card">
        <label>이메일 <input type="email" id="email" required></label>
        <label>비밀번호 <input type="password" id="password" required></label>
        <button type="submit">로그인</button>
    </form>
    <p id="result" class="message"></p>
</main>

<script src="/js/nav.js"></script>
<script src="/js/user/login.js"></script>
</body>
</html>
