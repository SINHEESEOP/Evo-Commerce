<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>타임세일 등록 - Evo-Commerce</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <a class="brand" href="/index.html">Evo-Commerce</a>
    <a href="/templates/product/products.html">상품 목록</a>
    <a href="/templates/timesale/timesales.html">타임세일</a>
    <span class="spacer"></span>
    <a href="/templates/user/login.html" id="nav-login">로그인</a>
    <a href="/templates/user/signup.html" id="nav-signup">회원가입</a>
    <a href="/templates/product/product-register.html" id="nav-register" hidden>상품 등록</a>
    <a href="/templates/timesale/timesale-register.html" id="nav-timesale-register" hidden>타임세일 등록</a>
    <button id="nav-logout" hidden>로그아웃</button>
</nav>
<main>
    <a class="back-link" href="/templates/timesale/timesales.html">← 타임세일 목록으로</a>
    <h1>타임세일 등록</h1>
    <form id="register-form" class="card">
        <label>상품 ID <input type="number" id="productId" min="1" required></label>
        <label>타임세일가 <input type="number" id="discountPrice" min="0" required></label>
        <label>선착순 인원 <input type="number" id="participantLimit" min="1" value="100" required></label>
        <label>시작 시각 <input type="datetime-local" id="startAt" required></label>
        <label>종료 시각 <input type="datetime-local" id="endAt" required></label>
        <button type="submit">등록하기</button>
    </form>
    <p id="permission-notice" class="message error" hidden>MASTER 권한이 있는 계정만 타임세일을 등록할 수 있습니다.</p>
    <p id="result" class="message"></p>
</main>

<script src="/js/nav.js"></script>
<script src="/js/timesale/timesale-register.js"></script>
</body>
</html>
