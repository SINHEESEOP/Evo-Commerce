<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상품 상세 - Evo-Commerce</title>
</head>
<body>
<h1>상품 상세</h1>
<dl id="product-detail"></dl>
<p id="result"></p>

<script>
    (async function () {
        const token = localStorage.getItem('accessToken');
        const result = document.getElementById('result');

        if (!token) {
            result.textContent = '로그인이 필요합니다.';
            return;
        }

        const id = new URLSearchParams(window.location.search).get('id');

        const response = await fetch(`/api/products/${id}`, {
            headers: {'Authorization': `Bearer ${token}`}
        });

        const body = await response.json();

        if (response.ok && body.success) {
            const detail = document.getElementById('product-detail');
            detail.innerHTML = `
                <dt>상품명</dt><dd>${body.data.name}</dd>
                <dt>가격</dt><dd>${body.data.price}원</dd>
                <dt>재고</dt><dd>${body.data.stock}개</dd>
            `;
        } else {
            result.textContent = `조회 실패: ${body.message}`;
        }
    })();
</script>
</body>
</html>
