<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>타임세일 - Evo-Commerce</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <a class="brand" href="/index.html">Evo-Commerce</a>
    <a href="/products.html">상품 목록</a>
    <a href="/timesales.html">타임세일</a>
    <span class="spacer"></span>
    <a href="/login.html" id="nav-login">로그인</a>
    <a href="/signup.html" id="nav-signup">회원가입</a>
    <a href="/product-register.html" id="nav-register" hidden>상품 등록</a>
    <a href="/timesale-register.html" id="nav-timesale-register" hidden>타임세일 등록</a>
    <button id="nav-logout" hidden>로그아웃</button>
</nav>
<main>
    <h1>타임세일</h1>
    <ul class="product-list" id="time-sale-list"></ul>
    <p id="result" class="message"></p>
</main>

<script src="/js/nav.js"></script>
<script>
    (async function () {
        const token = localStorage.getItem('accessToken');
        const result = document.getElementById('result');

        if (!token) {
            window.location.href = '/login.html';
            return;
        }

        const response = await fetch('/api/timesales', {
            headers: {'Authorization': `Bearer ${token}`}
        });

        if (handleUnauthorized(response)) {
            return;
        }

        const body = await response.json();

        if (response.ok && body.success) {
            const list = document.getElementById('time-sale-list');

            if (body.data.length === 0) {
                result.textContent = '진행 중인 타임세일이 없습니다.';
            }

            body.data.forEach(function (event) {
                const item = document.createElement('li');
                item.innerHTML = `
                    <a href="/timesale-detail.html?id=${event.id}">
                        ${event.productName}
                        <span class="price">${event.discountPrice.toLocaleString()}원</span>
                        <span class="stock">${event.currentParticipants} / ${event.participantLimit}명 참여</span>
                    </a>
                `;
                list.appendChild(item);
            });
        } else {
            result.textContent = `조회 실패: ${body.message}`;
            result.classList.add('error');
        }
    })();
</script>
</body>
</html>
