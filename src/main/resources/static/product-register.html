<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상품 등록 - Evo-Commerce</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <a class="brand" href="/index.html">Evo-Commerce</a>
    <a href="/products.html">상품 목록</a>
    <span class="spacer"></span>
    <a href="/login.html" id="nav-login">로그인</a>
    <a href="/signup.html" id="nav-signup">회원가입</a>
    <a href="/product-register.html" id="nav-register" hidden>상품 등록</a>
    <button id="nav-logout" hidden>로그아웃</button>
</nav>
<main>
    <a class="back-link" href="/products.html">← 상품 목록으로</a>
    <h1>상품 등록</h1>
    <form id="register-form" class="card">
        <label>상품명 <input type="text" id="name" required></label>
        <label>가격 <input type="number" id="price" min="0" required></label>
        <label>재고 <input type="number" id="stock" min="0" required></label>
        <button type="submit">등록하기</button>
    </form>
    <p id="permission-notice" class="message error" hidden>MASTER 권한이 있는 계정만 상품을 등록할 수 있습니다.</p>
    <p id="result" class="message"></p>
</main>

<script src="/js/nav.js"></script>
<script>
    const token = localStorage.getItem('accessToken');
    const role = localStorage.getItem('role');

    if (!token) {
        window.location.href = '/login.html';
    } else if (role !== 'MASTER') {
        document.getElementById('register-form').hidden = true;
        document.getElementById('permission-notice').hidden = false;
    }

    document.getElementById('register-form').addEventListener('submit', async function (event) {
        event.preventDefault();

        const response = await fetch('/api/products', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
                name: document.getElementById('name').value,
                price: Number(document.getElementById('price').value),
                stock: Number(document.getElementById('stock').value)
            })
        });

        const body = await response.json();
        const result = document.getElementById('result');

        if (response.ok && body.success) {
            result.textContent = `${body.data.name} 상품이 등록됐습니다. 상품 목록으로 이동합니다.`;
            result.classList.remove('error');
            setTimeout(function () {
                window.location.href = '/products.html';
            }, 1000);
        } else {
            result.textContent = `등록 실패: ${body.message}`;
            result.classList.add('error');
        }
    });
</script>
</body>
</html>
